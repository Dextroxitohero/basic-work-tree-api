services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: employee
      POSTGRES_PASSWORD: employee   # solo para desarrollo local
      POSTGRES_DB: employee_db
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - employee_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h fuerza TCP: durante la inicialización PostgreSQL solo escucha en el socket,
      # así que no se marca "healthy" antes de que existan las dos bases de datos.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U employee -d employee_db"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  employee_pgdata:
