[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-work-tree-api"
version = "0.1.0"
description = "API de empleados, historial de puestos y jerarquía (proyecto de práctica con FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165,<1",
    "uvicorn[standard]>=0.54,<1",
    "sqlalchemy[asyncio]>=2.1,<3",
    "asyncpg>=0.32,<1",
    "alembic>=1.20,<2",
    "pydantic[email]>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "pyjwt[crypto]>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "httpx>=0.28,<1",
    "ruff>=0.17,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un único event loop para toda la sesión: las conexiones de asyncpg quedan ligadas
# al loop que las creó, y el pool se comparte entre tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
